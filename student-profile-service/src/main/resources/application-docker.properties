spring.application.name=student-profile-service
server.port=8082

# inside Docker, localhost is this container, so the MySQL host is the Compose service name
spring.datasource.url=jdbc:mysql://student-profile-db:3306/student_profile_db
spring.datasource.username=root
# docker-compose.yml passes MYSQL_PASSWORD in, so no password is hard coded here
spring.datasource.password=${MYSQL_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# Eureka is reached by its Compose service name
eureka.client.service-url.defaultZone=http://service-registry:8761/eureka
# register the container IP so the gateway and Feign can reach this instance on the Docker network
eureka.instance.prefer-ip-address=true
